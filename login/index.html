<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>login</title>
    <link rel="stylesheet" href="/style.css">

</head>
<script src="/app.js"></script>
<body>
    <h2>Login</h2>
    <form action="/login" class="demo-card-container p-4 center align-center tab-content" id="registerTab" method="POST">
        <br><label for="username">Username:</label>
        <br><input type="text" id="username" name="username" required><br>
        <br><label for="password">Password:</label>
        <br><input type="password" id="password" name="password" required><br>
        <br><button type="submit">Login</button><br>
        <br><span>Don't have an account? <a href="/signup">Register here</a></span>
    </form>
</body>
</html>
