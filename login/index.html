<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Patient Health Record Management System</title>
  <link rel="stylesheet" href="../style.css">
</head>
<body style="min-height: 100vh; display: flex; align-items: center; justify-content: center; background-color: var(--bg-primary); padding: 1.5rem;">
  <div class="modal-box" style="display: block; max-width: 480px; width: 100%; box-shadow: var(--shadow-lg);">
    <div class="modal-header">
      <div class="modal-title-wrap">
        <span class="patient-id-badge">PHRMS Auth</span>
        <h3>Sign In to Clinic Portal</h3>
      </div>
      <a href="../index.html" class="modal-close-btn" style="text-decoration: none;">✕</a>
    </div>
    <div class="modal-body">
      <!-- Quick Demo Logins -->
      <div class="quick-login-strip" style="margin-bottom: 1.25rem;">
        <span class="quick-login-label">Quick 1-Click Demo Login:</span>
        <div class="quick-login-btns">
          <button type="button" class="btn btn-outline btn-xs" id="quickAdmBtn">🛡️ Admin</button>
          <button type="button" class="btn btn-outline btn-xs" id="quickPatBtn">👤 Patient</button>
        </div>
      </div>

      <form id="standaloneLoginForm">
        <div class="form-group" style="margin-bottom: 1rem;">
          <label for="username">Email Address / Username</label>
          <input type="email" id="username" required placeholder="admin@phrms.clinic or patient email">
        </div>
        <div class="form-group" style="margin-bottom: 1.25rem;">
          <label for="password">Password</label>
          <input type="password" id="password" required placeholder="••••••••">
        </div>
        <div class="auth-form-footer">
          <button type="submit" class="btn btn-primary btn-block">Log In</button>
          <p class="auth-switch-note">
            New patient? <a href="signup/index.html">Register yourself here &rarr;</a>
          </p>
          <p class="auth-switch-note" style="margin-top: 0.25rem;">
            <a href="../index.html">&larr; Return to Main Showcase</a>
          </p>
        </div>
      </form>
    </div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      // 1-Click test logins
      document.getElementById("quickAdmBtn").addEventListener("click", () => {
        document.getElementById("username").value = "admin@phrms.clinic";
        document.getElementById("password").value = "admin123";
        doLogin("admin@phrms.clinic", "admin123");
      });

      document.getElementById("quickPatBtn").addEventListener("click", () => {
        document.getElementById("username").value = "eleanor@gmail.com";
        document.getElementById("password").value = "patient123";
        doLogin("eleanor@gmail.com", "patient123");
      });

      document.getElementById("standaloneLoginForm").addEventListener("submit", (e) => {
        e.preventDefault();
        const email = document.getElementById("username").value;
        const pass = document.getElementById("password").value;
        doLogin(email, pass);
      });

      function doLogin(email, password) {
        const users = JSON.parse(localStorage.getItem("phrms_users") || "[]");
        const user = users.find(u => u.email.toLowerCase() === email.trim().toLowerCase() && u.password === password);
        if (!user) {
          alert("Invalid email or password. (Hint: Try admin@phrms.clinic / admin123 or eleanor@gmail.com / patient123)");
          return;
        }
        localStorage.setItem("phrms_current_user", JSON.stringify(user));
        window.location.href = "../index.html#demo";
      }
    });
  </script>
</body>
</html>
